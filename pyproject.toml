[project]
name = "retro-doc-lab"
version = "0.1.0"
requires-python = ">=3.11"
description = "Source-grounded retrospective documentation agent scaffold"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
retro-doc-lab = "retro_doc_agent.scan:main"
retro-doc-pipeline = "retro_doc_agent.pipeline:main"
