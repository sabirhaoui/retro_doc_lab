[project]
name = "retro-doc-lab"
version = "0.1.0"
requires-python = ">=3.11"
description = "Analyse statique et rétro-documentation de projets logiciels"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
]

[project.scripts]
retro-doc-lab = "retro_doc_agent.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
